<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pathweaver VR/MR</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body, html, #root {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        /* Ensure the canvas takes up the full screen and prevents mobile scrolling */
        canvas {
            display: block;
            touch-action: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Note the use of type="text/babel" and data-type="module" to allow ES imports + JSX -->
    <script type="text/babel" data-type="module">
        // --- External Dependencies (Loaded via ESM CDN) ---
        // Added explicit three mapping to prevent resolution errors in the browser environment
        import * as THREE from 'https://esm.sh/three';
        import React, { Suspense, useRef, useState, useEffect, useMemo } from 'https://esm.sh/react@19?external=three';
        import { createRoot } from 'https://esm.sh/react-dom@19/client?external=react,three';
        import { Canvas, useFrame, useThree } from 'https://esm.sh/@react-three/fiber?external=three,react';
        import { XR, createXRStore, XRButton, useXR } from 'https://esm.sh/@react-three/xr?external=three,react,@react-three/fiber';
        import { Sky, OrbitControls, Environment, ContactShadows, Text, Float, RoundedBox, Trail } from 'https://esm.sh/@react-three/drei?external=three,react,@react-three/fiber';
        import { create } from 'https://esm.sh/zustand';

        // --- Audio Service (Procedural Sound) ---
        class AudioService {
            constructor() { this.ctx = null; }
            init() { 
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playChime(pitch = 440) {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(pitch, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(pitch * 1.5, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.3);
            }
            playFall() {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 1);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 1);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 1);
            }
            playReset() {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(110, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(440, this.ctx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.5);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.5);
            }
        }
        const audioService = new AudioService();

        // --- Game State Management ---
        const BASE_SPEED = 1.2;
        const SPEED_INCREMENT = 0.03;
        const useGameStore = create((set) => ({
            level: 1,
            speed: BASE_SPEED,
            mode: 'VR',
            tiles: [{ id: 'start', position: [0, 0, 0], color: '#ff00ff' }],
            addTile: (position, color) => set((state) => ({
                tiles: [...state.tiles, { id: Math.random().toString(), position, color }],
                level: state.level + 1,
                speed: Math.min(2.5, BASE_SPEED + (Math.floor((state.level + 1) / 10) * SPEED_INCREMENT))
            })),
            resetGame: () => set({
                level: 1,
                speed: BASE_SPEED,
                tiles: [{ id: 'start', position: [0, 0, 0], color: '#ff00ff' }]
            }),
            setMode: (mode) => set({ mode }),
        }));

        // --- Constants ---
        const TILE_SIZE = 0.6;
        const COOLDOWN = 400;
        const COLORS = ['#ff0055', '#00ffcc', '#aaff00', '#ff00ff', '#00ffff', '#ffaa00'];

        // --- Road Component ---
        function Road() {
            const { tiles, addTile } = useGameStore();
            const [lastPlacementTime, setLastPlacementTime] = useState(0);
            const [ghostPosition, setGhostPosition] = useState(null);
            const { camera } = useThree();

            const lastTile = tiles[tiles.length - 1];
            const lastPos = useMemo(() => new THREE.Vector3(...lastTile.position), [lastTile.position]);

            useFrame(() => {
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                forward.y = 0; 
                forward.normalize();
                const nextPos = lastPos.clone().add(forward.multiplyScalar(TILE_SIZE));
                setGhostPosition([nextPos.x, nextPos.y, nextPos.z]);
            });

            const handlePlace = () => {
                const now = Date.now();
                if (now - lastPlacementTime < COOLDOWN) return;
                if (ghostPosition) {
                    const color = COLORS[Math.floor(Math.random() * COLORS.length)];
                    addTile(ghostPosition, color);
                    setLastPlacementTime(now);
                    audioService.playChime(440 + (tiles.length * 10));
                }
            };

            useEffect(() => {
                window.addEventListener('mousedown', handlePlace);
                window.addEventListener('touchstart', handlePlace);
                return () => {
                    window.removeEventListener('mousedown', handlePlace);
                    window.removeEventListener('touchstart', handlePlace);
                };
            }, [ghostPosition, lastPlacementTime]);

            return (
                <group>
                    {tiles.map((tile, index) => (
                        <mesh key={tile.id} position={tile.position} receiveShadow castShadow>
                            <boxGeometry args={[TILE_SIZE, 0.05, TILE_SIZE]} />
                            <meshStandardMaterial 
                                color={tile.color} 
                                emissive={tile.color} 
                                emissiveIntensity={(index / 10) + 0.5} 
                            />
                        </mesh>
                    ))}
                    {ghostPosition && (
                        <mesh position={ghostPosition}>
                            <boxGeometry args={[TILE_SIZE, 0.02, TILE_SIZE]} />
                            <meshStandardMaterial color="white" transparent opacity={0.3} />
                        </mesh>
                    )}
                </group>
            );
        }

        // --- Vehicle Component ---
        function Vehicle() {
            const { tiles, speed, resetGame } = useGameStore();
            const carRef = useRef();
            const [currentIndex, setCurrentIndex] = useState(0);
            const [progress, setProgress] = useState(0);
            const [isFalling, setIsFalling] = useState(false);

            useFrame((state, delta) => {
                if (isFalling) {
                    if (carRef.current) {
                        carRef.current.position.y -= 5 * delta;
                        carRef.current.rotation.x += 10 * delta;
                        if (carRef.current.position.y < -5) {
                            resetGame(); 
                            setCurrentIndex(0); 
                            setProgress(0); 
                            setIsFalling(false);
                            if (carRef.current) carRef.current.position.y = 0.1;
                        }
                    }
                    return;
                }
                if (tiles.length <= 1) return;
                
                const currentTile = tiles[currentIndex];
                const nextTile = tiles[currentIndex + 1];
                
                if (!nextTile && progress >= 1) {
                    setIsFalling(true); 
                    audioService.playFall(); 
                    return;
                }
                
                const newProgress = progress + (speed * delta) / TILE_SIZE;
                setProgress(newProgress);
                
                if (newProgress >= 1 && currentIndex + 1 < tiles.length) {
                    setCurrentIndex(currentIndex + 1); 
                    setProgress(newProgress - 1);
                }
                
                if (carRef.current) {
                    const start = new THREE.Vector3(...currentTile.position);
                    const end = nextTile 
                        ? new THREE.Vector3(...nextTile.position) 
                        : start.clone().add(new THREE.Vector3(0, 0, -TILE_SIZE).applyQuaternion(carRef.current.quaternion));
                    
                    const pos = start.clone().lerp(end, progress);
                    carRef.current.position.copy(pos); 
                    carRef.current.position.y += 0.1;
                    
                    if (nextTile) {
                        const lookAt = new THREE.Vector3(...nextTile.position);
                        lookAt.y = carRef.current.position.y; 
                        carRef.current.lookAt(lookAt);
                    }
                }
            });

            useEffect(() => {
                if (tiles.length === 1) {
                    setCurrentIndex(0); 
                    setProgress(0); 
                    setIsFalling(false);
                    if (carRef.current) { 
                        carRef.current.position.set(0, 0.1, 0); 
                        carRef.current.rotation.set(0, 0, 0); 
                    }
                }
            }, [tiles.length]);

            return (
                <group ref={carRef}>
                    <mesh castShadow>
                        <boxGeometry args={[0.15, 0.08, 0.22]} />
                        <meshStandardMaterial 
                            color={isFalling ? "red" : "white"} 
                            emissive={isFalling ? "red" : "white"} 
                            emissiveIntensity={0.5} 
                        />
                    </mesh>
                    <Trail width={1} length={8} color={isFalling ? "red" : "cyan"} attenuation={(t) => t * t} />
                </group>
            );
        }

        // --- HUD Component ---
        function HUD() {
            const { level, speed, resetGame } = useGameStore();
            const hudRef = useRef();
            const { camera } = useThree();

            useFrame(() => {
                if (!hudRef.current) return;
                const targetPos = new THREE.Vector3(0.8, -0.5, -1.5).applyQuaternion(camera.quaternion).add(camera.position);
                hudRef.current.position.lerp(targetPos, 0.1);
                hudRef.current.quaternion.slerp(camera.quaternion, 0.1);
            });

            return (
                <group ref={hudRef}>
                    <Float speed={2} rotationIntensity={0.5} floatIntensity={0.5}>
                        <RoundedBox args={[0.6, 0.4, 0.02]} radius={0.02}>
                            <meshStandardMaterial color="#111111" transparent opacity={0.8} />
                        </RoundedBox>
                        <Text position={[0, 0.05, 0.02]} fontSize={0.15} color="#00ffcc">
                            {level}
                        </Text>
                        <Text position={[0, -0.05, 0.02]} fontSize={0.04} color="white">
                            TILES PLACED
                        </Text>
                        <Text position={[0, -0.12, 0.02]} fontSize={0.03} color="#ffaa00">
                            {`SPEED: ${speed.toFixed(2)} m/s`}
                        </Text>
                        <mesh 
                            position={[0, -0.2, 0.02]} 
                            onClick={() => { resetGame(); audioService.playReset(); }}
                        >
                            <RoundedBox args={[0.3, 0.1, 0.02]} radius={0.01}>
                                <meshStandardMaterial color="#ff0055" emissive="#ff0055" emissiveIntensity={0.5} />
                            </RoundedBox>
                            <Text position={[0, 0, 0.011]} fontSize={0.04} color="white">
                                RESET
                            </Text>
                        </mesh>
                    </Float>
                </group>
            );
        }

        // --- Main Scene ---
        const store = createXRStore({ hand: true, controller: true, emulate: true });

        function SceneContent() {
            const { mode, setMode } = useGameStore();
            const xr = useXR();
            
            useEffect(() => {
                if (xr && xr.session) {
                    setMode(xr.session.environmentBlendMode === 'additive' ? 'MR' : 'VR');
                }
            }, [xr?.session]);

            return (
                <Suspense fallback={null}>
                    <Environment preset="night" />
                    <ambientLight intensity={0.5} />
                    <pointLight position={[10, 10, 10]} intensity={1} castShadow />
                    
                    {mode === 'VR' && (
                        <>
                            <Sky sunPosition={[100, 20, 100]} />
                            <gridHelper args={[100, 100, 0x444444, 0x222222]} position={[0, -0.01, 0]} />
                        </>
                    )}
                    
                    <Road />
                    <Vehicle />
                    <HUD />
                    <OrbitControls makeDefault />
                    <ContactShadows opacity={0.4} scale={10} blur={2} far={10} resolution={256} color="#000000" />
                </Suspense>
            );
        }

        function App() {
            return (
                <div className="w-full h-screen bg-black relative">
                    <div className="absolute top-4 left-4 z-10 flex gap-2">
                        <XRButton store={store} mode="immersive-vr" className="px-4 py-2 bg-white/10 text-white rounded-lg hover:bg-white/20 border border-white/20 transition-all cursor-pointer backdrop-blur-md">
                            Enter VR
                        </XRButton>
                        <XRButton store={store} mode="immersive-ar" className="px-4 py-2 bg-white/10 text-white rounded-lg hover:bg-white/20 border border-white/20 transition-all cursor-pointer backdrop-blur-md">
                            Enter MR
                        </XRButton>
                    </div>
                    
                    <Canvas shadows camera={{ position: [0, 2, 5], fov: 75 }}>
                        <XR store={store}>
                            <SceneContent />
                        </XR>
                    </Canvas>
                </div>
            );
        }

        // --- Render ---
        const rootElement = document.getElementById('root');
        createRoot(rootElement).render(<App />);
    </script>
</body>
</html>
