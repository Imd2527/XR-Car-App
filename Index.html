<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pathweaver VR/MR | Infinite Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html, #root {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #050505; color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center; z-index: 100;
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@19",
            "react-dom": "https://esm.sh/react-dom@19",
            "react-dom/client": "https://esm.sh/react-dom@19/client",
            "three": "https://esm.sh/three@0.170.0",
            "@react-three/fiber": "https://esm.sh/@react-three/fiber@9",
            "@react-three/drei": "https://esm.sh/@react-three/drei@10",
            "@react-three/xr": "https://esm.sh/@react-three/xr@6",
            "zustand": "https://esm.sh/zustand@5"
        }
    }
    </script>
</head>
<body>
    <div id="loading">
        <h1 class="text-2xl font-bold mb-2">PATHWEAVER</h1>
        <p class="text-gray-400 animate-pulse">Initializing Reality...</p>
    </div>
    <div id="root"></div>

    <script type="module">
        import React, { Suspense, useRef, useState, useEffect, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import * as THREE from 'three';
        import { Canvas, useFrame, useThree } from '@react-three/fiber';
        import { XR, createXRStore, XRButton, useXR } from '@react-three/xr';
        import { Sky, OrbitControls, Environment, ContactShadows, Text, Float, RoundedBox, Trail } from '@react-three/drei';
        import { create } from 'zustand';

        // --- Audio Engine ---
        class AudioEngine {
            constructor() { this.ctx = null; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            play(freq, type = 'sine', duration = 0.3) {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq * 0.5, this.ctx.currentTime + duration);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + duration);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + duration);
            }
        }
        const audio = new AudioEngine();

        // --- State Management ---
        const useGame = create((set) => ({
            level: 1,
            speed: 1.2,
            tiles: [{ id: '0', position: [0, 0, 0], color: '#00ffcc' }],
            addTile: (pos) => set((s) => ({
                tiles: [...s.tiles, { id: Math.random().toString(), position: pos, color: `hsl(${s.level * 20 % 360}, 100%, 60%)` }],
                level: s.level + 1,
                speed: Math.min(3, 1.2 + (s.level * 0.02))
            })),
            reset: () => set({ level: 1, speed: 1.2, tiles: [{ id: '0', position: [0, 0, 0], color: '#00ffcc' }] })
        }));

        const store = createXRStore({ depthSensing: true, hand: true });

        // --- Core Components ---
        function Road() {
            const { tiles, addTile } = useGame();
            const [ghost, setGhost] = useState([0, 0, -0.6]);
            const { camera } = useThree();
            const TILE_S = 0.6;

            useFrame(() => {
                const last = new THREE.Vector3(...tiles[tiles.length - 1].position);
                const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                dir.y = 0; dir.normalize();
                const next = last.add(dir.multiplyScalar(TILE_S));
                setGhost([next.x, next.y, next.z]);
            });

            const place = () => {
                audio.play(440 + (tiles.length * 20));
                addTile(ghost);
            };

            // Input Listeners
            useEffect(() => {
                const handleDown = (e) => { if(e.button === 0) place(); };
                window.addEventListener('mousedown', handleDown);
                return () => window.removeEventListener('mousedown', handleDown);
            }, [ghost]);

            return React.createElement('group', null,
                tiles.map((t, i) => React.createElement('mesh', { key: t.id, position: t.position },
                    React.createElement('boxGeometry', { args: [TILE_S * 0.95, 0.05, TILE_S * 0.95] }),
                    React.createElement('meshStandardMaterial', { color: t.color, emissive: t.color, emissiveIntensity: 0.5 })
                )),
                React.createElement('mesh', { position: ghost },
                    React.createElement('boxGeometry', { args: [TILE_S, 0.02, TILE_S] }),
                    React.createElement('meshStandardMaterial', { color: 'white', transparent: true, opacity: 0.2 })
                )
            );
        }

        function Vehicle() {
            const { tiles, speed, reset } = useGame();
            const ref = useRef();
            const [idx, setIdx] = useState(0);
            const [prog, setProg] = useState(0);
            const [falling, setFalling] = useState(false);

            useFrame((_, delta) => {
                if (falling) {
                    ref.current.position.y -= 10 * delta;
                    ref.current.rotation.x += 5 * delta;
                    if (ref.current.position.y < -10) {
                        setFalling(false); setIdx(0); setProg(0); reset();
                    }
                    return;
                }

                if (tiles.length <= 1) return;
                const nextIdx = idx + 1;
                const step = (speed * delta) / 0.6;
                const newProg = prog + step;

                if (newProg >= 1) {
                    if (nextIdx < tiles.length - 1) {
                        setIdx(nextIdx); setProg(newProg - 1);
                    } else if (newProg > 1.2) {
                        setFalling(true); audio.play(100, 'sawtooth', 1);
                    } else {
                        setProg(newProg);
                    }
                } else {
                    setProg(newProg);
                }

                const currPos = new THREE.Vector3(...tiles[idx].position);
                const nextPos = tiles[idx+1] ? new THREE.Vector3(...tiles[idx+1].position) : currPos.clone();
                ref.current.position.copy(currPos.lerp(nextPos, Math.min(prog, 1)));
                ref.current.position.y += 0.15;
                if(tiles[idx+1]) ref.current.lookAt(nextPos.x, 0.15, nextPos.z);
            });

            return React.createElement('group', { ref },
                React.createElement(Float, { floatingRange: [0, 0.05] },
                    React.createElement('mesh', null,
                        React.createElement('boxGeometry', { args: [0.2, 0.1, 0.3] }),
                        React.createElement('meshStandardMaterial', { color: falling ? 'red' : 'white' })
                    )
                ),
                React.createElement(Trail, { width: 1.5, length: 10, color: falling ? 'red' : '#00ffff' })
            );
        }

        function Scene() {
            return React.createElement(React.Fragment, null,
                React.createElement(Environment, { preset: "city" }),
                React.createElement('ambientLight', { intensity: 0.2 }),
                React.createElement('pointLight', { position: [5, 5, 5], intensity: 2 }),
                React.createElement(Sky, { distance: 450000, sunPosition: [0, 1, 0] }),
                React.createElement(Road),
                React.createElement(Vehicle),
                React.createElement(OrbitControls, { makeDefault: true, target: [0, 0, 0] }),
                React.createElement(ContactShadows, { resolution: 512, scale: 20, blur: 2, opacity: 0.5, far: 10 })
            );
        }

        function App() {
            useEffect(() => { document.getElementById('loading').style.display = 'none'; }, []);

            return React.createElement('div', { className: "w-full h-full relative" },
                React.createElement('div', { className: "absolute top-6 left-6 z-20 flex flex-col gap-4" },
                    React.createElement('div', null,
                        React.createElement('h1', { className: "text-4xl font-black tracking-tighter" }, "PATHWEAVER"),
                        React.createElement('p', { className: "text-xs uppercase tracking-widest text-cyan-400" }, "Infinite Reality Construct")
                    ),
                    React.createElement('div', { className: "flex gap-2" },
                        React.createElement(XRButton, { store, mode: 'immersive-vr', className: "px-6 py-3 bg-white text-black font-bold rounded-full hover:scale-105 transition" }, "START VR"),
                        React.createElement(XRButton, { store, mode: 'immersive-ar', className: "px-6 py-3 bg-cyan-500 text-white font-bold rounded-full hover:scale-105 transition" }, "START MR")
                    )
                ),
                React.createElement(Canvas, { shadows: true, camera: { position: [3, 3, 3], fov: 75 } },
                    React.createElement(XR, { store },
                        React.createElement(Suspense, { fallback: null },
                            React.createElement(Scene)
                        )
                    )
                )
            );
        }

        createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
</body>
</html>
