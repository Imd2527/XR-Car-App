<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pathweaver VR/MR | GitHub Hosted</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body, html, #root {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050505;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: white;
            touch-action: none;
        }
        canvas {
            display: block;
            touch-action: none;
        }
        #loading {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #000; z-index: 100;
            transition: opacity 0.8s ease;
        }
    </style>

    <!-- ESM Import Map: Essential for resolving React and Three.js modules correctly -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom": "https://esm.sh/react-dom@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "three": "https://esm.sh/three@0.160.0",
            "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.15.12?external=three,react,react-dom",
            "@react-three/drei": "https://esm.sh/@react-three/drei@9.96.1?external=three,react,react-dom,@react-three/fiber",
            "@react-three/xr": "https://esm.sh/@react-three/xr@6.0.13?external=three,react,react-dom,@react-three/fiber",
            "zustand": "https://esm.sh/zustand@4.5.0"
        }
    }
    </script>
</head>
<body>
    <div id="loading">
        <h1 class="text-3xl font-black mb-6 tracking-[0.3em] text-cyan-400 italic">PATHWEAVER</h1>
        <div class="w-16 h-16 border-2 border-cyan-400/20 border-t-cyan-400 rounded-full animate-spin"></div>
        <p class="mt-6 text-xs uppercase tracking-widest opacity-40">Loading Spatial Modules</p>
    </div>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import * as THREE from 'three';
        import React, { Suspense, useRef, useState, useEffect, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Canvas, useFrame, useThree } from '@react-three/fiber';
        import { XR, createXRStore, useXR } from '@react-three/xr';
        import { Sky, OrbitControls, Environment, ContactShadows, Text, Float, RoundedBox, Trail } from '@react-three/drei';
        import { create } from 'zustand';

        // --- Audio Service ---
        class AudioService {
            constructor() { this.ctx = null; }
            init() { 
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playChime(pitch = 440) {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(pitch, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(pitch * 1.2, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.4);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.4);
            }
            playFall() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(20, this.ctx.currentTime + 1);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 1);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 1);
            }
        }
        const audio = new AudioService();

        // --- State Management ---
        const useGameStore = create((set) => ({
            level: 1,
            speed: 1.2,
            mode: 'VR',
            tiles: [{ id: 'start', position: [0, 0, 0], color: '#22d3ee' }],
            addTile: (position, color) => set((state) => ({
                tiles: [...state.tiles, { id: Math.random().toString(), position, color }],
                level: state.level + 1,
                speed: Math.min(3, state.speed + 0.05)
            })),
            resetGame: () => set({
                level: 1,
                speed: 1.2,
                tiles: [{ id: 'start', position: [0, 0, 0], color: '#22d3ee' }]
            }),
            setMode: (mode) => set({ mode }),
        }));

        const TILE_SIZE = 0.65;
        const COLORS = ['#22d3ee', '#818cf8', '#f472b6', '#fbbf24', '#34d399'];

        // --- Gameplay Components ---
        function Road() {
            const { tiles, addTile } = useGameStore();
            const { camera } = useThree();
            const [ghostPos, setGhostPos] = useState([0, 0, -TILE_SIZE]);

            useFrame(() => {
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                forward.y = 0;
                forward.normalize();
                const last = new THREE.Vector3(...tiles[tiles.length - 1].position);
                const next = last.clone().add(forward.multiplyScalar(TILE_SIZE));
                setGhostPos([next.x, next.y, next.z]);
            });

            const place = () => {
                const color = COLORS[Math.floor(Math.random() * COLORS.length)];
                addTile(ghostPos, color);
                audio.playChime(300 + (tiles.length * 20));
            };

            return (
                <group>
                    <mesh visible={false} onPointerDown={place}>
                        <sphereGeometry args={[50, 8, 8]} />
                        <meshBasicMaterial side={THREE.BackSide} />
                    </mesh>
                    {tiles.map((t, i) => (
                        <mesh key={t.id} position={t.position}>
                            <boxGeometry args={[TILE_SIZE, 0.04, TILE_SIZE]} />
                            <meshStandardMaterial 
                                color={t.color} 
                                emissive={t.color} 
                                emissiveIntensity={0.5 + (i/20)} 
                            />
                        </mesh>
                    ))}
                    <mesh position={ghostPos}>
                        <boxGeometry args={[TILE_SIZE, 0.01, TILE_SIZE]} />
                        <meshStandardMaterial color="white" transparent opacity={0.3} />
                    </mesh>
                </group>
            );
        }

        function Vehicle() {
            const { tiles, speed, resetGame } = useGameStore();
            const ref = useRef();
            const [idx, setIdx] = useState(0);
            const [prog, setProg] = useState(0);
            const [falling, setFalling] = useState(false);

            useFrame((_, delta) => {
                if (falling) {
                    if (ref.current) {
                        ref.current.position.y -= 10 * delta;
                        ref.current.rotation.x += 5 * delta;
                        if (ref.current.position.y < -5) {
                            resetGame(); setIdx(0); setProg(0); setFalling(false);
                        }
                    }
                    return;
                }

                if (tiles.length <= 1) return;
                
                const current = tiles[idx];
                const next = tiles[idx + 1];

                if (!next && prog >= 1) {
                    setFalling(true);
                    audio.playFall();
                    return;
                }

                const dProg = (speed * delta) / TILE_SIZE;
                const nextProg = prog + dProg;
                
                if (nextProg >= 1 && idx + 1 < tiles.length) {
                    setIdx(idx + 1);
                    setProg(nextProg - 1);
                } else {
                    setProg(nextProg);
                }

                if (ref.current) {
                    const pA = new THREE.Vector3(...current.position);
                    const pB = next ? new THREE.Vector3(...next.position) : pA.clone().add(new THREE.Vector3(0,0,-TILE_SIZE));
                    ref.current.position.copy(pA.clone().lerp(pB, prog));
                    ref.current.position.y += 0.1;
                    if (next) {
                        const look = new THREE.Vector3(...next.position);
                        look.y = ref.current.position.y;
                        ref.current.lookAt(look);
                    }
                }
            });

            return (
                <group ref={ref}>
                    <Trail width={1} length={8} color={falling ? "red" : "#22d3ee"} attenuation={(t) => t * t}>
                        <mesh>
                            <boxGeometry args={[0.15, 0.08, 0.25]} />
                            <meshStandardMaterial color="white" emissive="white" emissiveIntensity={1} />
                        </mesh>
                    </Trail>
                </group>
            );
        }

        function HUD() {
            const { level, speed, resetGame } = useGameStore();
            const ref = useRef();
            const { camera } = useThree();

            useFrame(() => {
                if (!ref.current) return;
                const target = new THREE.Vector3(0.8, -0.5, -1.5).applyQuaternion(camera.quaternion).add(camera.position);
                ref.current.position.lerp(target, 0.1);
                ref.current.quaternion.slerp(camera.quaternion, 0.1);
            });

            return (
                <group ref={ref}>
                    <Float speed={2} rotationIntensity={0.5} floatIntensity={0.5}>
                        <RoundedBox args={[0.6, 0.4, 0.02]} radius={0.02}>
                            <meshStandardMaterial color="#111" transparent opacity={0.9} />
                        </RoundedBox>
                        <Text position={[0, 0.1, 0.02]} fontSize={0.12} color="#22d3ee">{level}</Text>
                        <Text position={[0, -0.02, 0.02]} fontSize={0.03} color="white">SCORE</Text>
                        <mesh position={[0, -0.12, 0.022]} onClick={() => { resetGame(); audio.playChime(200); }}>
                            <RoundedBox args={[0.3, 0.08, 0.01]} radius={0.01}>
                                <meshStandardMaterial color="#f472b6" />
                            </RoundedBox>
                            <Text position={[0, 0, 0.01]} fontSize={0.04} color="white">RESET</Text>
                        </mesh>
                    </Float>
                </group>
            );
        }

        // --- Main Scene Setup ---
        const xrStore = createXRStore({ hand: true, controller: true });

        function Scene() {
            const { setMode } = useGameStore();
            const xr = useXR();

            useEffect(() => {
                if (xr?.session) {
                    setMode(xr.session.environmentBlendMode === 'additive' ? 'MR' : 'VR');
                    audio.init();
                }
            }, [xr, setMode]);

            return (
                <Suspense fallback={null}>
                    <Environment preset="city" />
                    <ambientLight intensity={0.5} />
                    <pointLight position={[10, 10, 10]} intensity={1} />
                    <Sky sunPosition={[100, 20, 100]} />
                    <Road />
                    <Vehicle />
                    <HUD />
                    <OrbitControls enableZoom={false} />
                    <ContactShadows opacity={0.4} scale={10} blur={2} far={10} />
                </Suspense>
            );
        }

        function App() {
            useEffect(() => {
                const l = document.getElementById('loading');
                if (l) {
                    l.style.opacity = '0';
                    setTimeout(() => l.remove(), 800);
                }
            }, []);

            return (
                <div className="w-full h-full relative">
                    <div className="absolute top-8 left-8 z-20 flex flex-col gap-4">
                        <button 
                            onClick={() => xrStore.enterVR()}
                            className="bg-cyan-500 text-black px-8 py-3 rounded-full font-black text-xs tracking-tighter hover:scale-105 transition-transform"
                        >
                            LAUNCH VR
                        </button>
                        <button 
                            onClick={() => xrStore.enterAR()}
                            className="bg-white/10 backdrop-blur-md text-white border border-white/20 px-8 py-3 rounded-full font-black text-xs tracking-tighter hover:bg-white/20 transition-all"
                        >
                            MIXED REALITY
                        </button>
                    </div>

                    <div className="absolute bottom-8 left-8 z-20 text-[10px] tracking-[0.4em] opacity-30 uppercase">
                        Spatial Experience // 001
                    </div>

                    <Canvas shadows dpr={[1, 2]} camera={{ position: [0, 1.6, 3] }}>
                        <XR store={xrStore}>
                            <Scene />
                        </XR>
                    </Canvas>
                </div>
            );
        }

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
